on:
  workflow_dispatch:
    inputs:
      ENVIRONMENT:
        description: Environment
        type: choice
        options:
          - develop
          - uat
          - production
      MANUAL_CHANGE_MODE:
        description: How to handle flows changed outside deployment
        type: choice
        options:
          - normal
          - partial
          - strict
        default: normal

env:
  TWILIO_API_KEY: ${{ vars[format('{0}_TWILIO_API_KEY', inputs.ENVIRONMENT)] }}
  TWILIO_API_SECRET: ${{ secrets[format('{0}_TWILIO_API_SECRET', inputs.ENVIRONMENT)] }}

jobs:
  validate:
    runs-on: ubuntu-22.04
    steps:
      - uses: zingdevlimited/studio-flow-actions/validate@v1
        with:
          CONFIG_PATH: studioconfig.json
          TWILIO_API_KEY: ${{ env.TWILIO_API_KEY }}
          TWILIO_API_SECRET: ${{ env.TWILIO_API_SECRET }}
          MANUAL_CHANGE_MODE: ${{ inputs.MANUAL_CHANGE_MODE }}
        env:
          ASSETS_BASE_URL: https://yourassets.com
  deploy:
    needs: validate
    runs-on: ubuntu-22.04
    steps:
      # Ensure the same inputs are used as the validate step
      - uses: zingdevlimited/studio-flow-actions/deploy@v1
        with:
          CONFIG_PATH: studioconfig.json
          TWILIO_API_KEY: ${{ env.TWILIO_API_KEY }}
          TWILIO_API_SECRET: ${{ env.TWILIO_API_SECRET }}
          ALLOW_PARTIAL_DEPLOY: ${{ inputs.MANUAL_CHANGE_MODE == 'partial' }}
        env:
          ASSETS_BASE_URL: https://yourassets.com
