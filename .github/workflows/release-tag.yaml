name: Tag release

on:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  tag:
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release/v')
    runs-on: ubuntu-22.04

    steps:
      - name: Update tags to point to merge commit
        uses: actions/github-script@v7
        env:
          RELEASE_BRANCH: ${{ github.event.pull_request.head.ref }}
          MERGE_COMMIT_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        with:
          script: |
            const version = process.env.RELEASE_BRANCH.replace("release/v", "");
            const [major, minor, patch] = version.split(".");
            const commitHash = process.env.MERGE_COMMIT_SHA;
            const tags = [
              `v${major}.${minor}.${patch}`,
              `v${major}.${minor}`,
              `v${major}`
            ];
            for (const tag of tags) {
              let ref;
              try {
                ref = await github.rest.git.getRef({
                  ...context.repo,
                  ref: `tags/${tag}`
                })
              } catch (e) {
                if (e.status === 404) {
                  // continue
                }
              }
              if (!ref) {
                await github.rest.git.createRef({
                  ...context.repo,
                  ref: `refs/tags/${tag}`,
                  sha: commitHash
                });
              } else {
                await github.rest.git.updateRef({
                  ...context.repo,
                  ref: `tags/${tag}`,
                  sha: commitHash
                })
              }
            }
